name: Publish release

# Publishes a GitHub release from files staged on a temporary branch.
# The files must already have passed the Windows build, install and smoke tests;
# this workflow only verifies their checksums and attaches them to the release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.0.0'
        required: true
      assets_branch:
        description: 'Branch holding release/ files and release-notes.md'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.assets_branch }}
          path: assets
      - name: Verify checksums and expected files
        working-directory: assets/release
        run: |
          v='${{ inputs.version }}'
          test -f "BundleBloom-Setup-$v-win-x64.exe"
          test -f "BundleBloom-$v-win-x64.zip"
          sha256sum -c SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v='${{ inputs.version }}'
          gh release create "v$v" assets/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git -C assets rev-parse origin/main 2>/dev/null || echo main)" \
            --title "BundleBloom $v" \
            --notes-file assets/release-notes.md
